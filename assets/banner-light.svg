<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7FAF9"/>
      <stop offset="60%" stop-color="#F1F7F5"/>
      <stop offset="100%" stop-color="#E6F2EE"/>
    </linearGradient>
    <radialGradient id="glow-accretion-light" cx="930" cy="152" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A5243" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#26D0A8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F7FAF9" stop-opacity="0"/>
