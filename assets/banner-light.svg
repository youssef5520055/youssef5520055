      <path d="M46 23.5H58.4M46 23.5V55M46 39H56M46 55H58.8M58.4 23.5V26.7M58.8 55V51.8" stroke="#0A5243" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

