      <rect x="7" y="7" width="64" height="64" rx="11.5" stroke="#0A5243" stroke-opacity="0.38" stroke-width="1.15"/>
      <path d="M62.5 13L65 15.5L62.5 18L60 15.5L62.5 13Z" fill="#0A5243"/>
